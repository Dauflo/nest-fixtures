name: Linter

on:
  push:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Code format
        run: |
          npm ci
          npm run format

      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "format: automatic code formatting with prettier"